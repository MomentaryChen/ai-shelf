name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Self-signed Authenticode — no secrets or CA purchase required.
      # SmartScreen still warns (cert is not publicly trusted). See docs/WINDOWS_CODE_SIGNING.md.
      - name: Prepare self-signed code signing certificate
        shell: pwsh
        run: ./scripts/new-selfsigned-codesign.ps1 -ForCi

      - name: Package Windows installer
        run: pnpm exec electron-builder --win --publish never

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'AI-Shelf-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found in release/' }
          ./scripts/verify-windows-signature.ps1 -Path $installer.FullName -RequireSigned

      - name: Self-signed build notice
        run: |
          echo "::notice::Installer is self-signed (not CA-trusted). SmartScreen may still warn users. See docs/WINDOWS_CODE_SIGNING.md"

      # Release body matches CHANGELOG.md for this tag (single source of truth).
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AI-Shelf-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          body_path: release-notes.md
          generate_release_notes: false
