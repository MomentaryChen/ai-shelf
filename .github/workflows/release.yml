name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish ai-shelf to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter ai-shelf run build

      - name: Publish to npm
        run: pnpm --filter ai-shelf publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure code signing certificate
        shell: pwsh
        env:
          REPO_CSC_LINK: ${{ secrets.CSC_LINK }}
          REPO_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:REPO_CSC_LINK -and $env:REPO_CSC_KEY_PASSWORD) {
            "CSC_LINK=$env:REPO_CSC_LINK" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_KEY_PASSWORD=$env:REPO_CSC_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Using repository CSC_LINK / CSC_KEY_PASSWORD secrets."
          } else {
            Write-Host "Repository CSC_* secrets not configured; fallback self-signed cert will be generated."
          }

      - name: Prepare fallback self-signed certificate
        if: env.CSC_LINK == '' || env.CSC_KEY_PASSWORD == ''
        shell: pwsh
        run: ./scripts/new-selfsigned-codesign.ps1 -ForCi

      - name: Verify signing certificate is configured
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw 'CSC_LINK / CSC_KEY_PASSWORD were not set. Configure GitHub secrets or use fallback.'
          }
          if (Test-Path -LiteralPath $env:CSC_LINK) {
            Write-Host "Signing certificate file ready: $($env:CSC_LINK)"
          } else {
            Write-Host "CSC_LINK set (base64 or URL); electron-builder will load the certificate."
          }

      - name: Package Windows installer
        env:
          CSC_LINK: ${{ env.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --publish never

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'AI-Shelf-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found in release/' }
          ./scripts/verify-windows-signature.ps1 -Path $installer.FullName -RequireSigned

      - name: Self-signed build notice
        if: secrets.CSC_LINK == '' || secrets.CSC_KEY_PASSWORD == ''
        run: |
          echo "::notice::Installer is self-signed (not CA-trusted). SmartScreen may still warn users. See docs/WINDOWS_CODE_SIGNING.md"

      - name: Repository-signing notice
        if: secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != ''
        run: |
          echo "::notice::Installer was signed using repository CSC_LINK / CSC_KEY_PASSWORD secrets."

      # Release body matches CHANGELOG.md for this tag (single source of truth).
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AI-Shelf-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          body_path: release-notes.md
          generate_release_notes: false
