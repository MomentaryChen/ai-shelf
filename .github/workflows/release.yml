name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish ai-shelf to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter ai-shelf run build

      - name: Publish to npm
        run: pnpm --filter ai-shelf publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Firebase Web client config (public). Set matching repository secrets so release
          # installers include Google sign-in / sync. Omit secrets to ship without Firebase.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      - name: Configure code signing certificate
        shell: pwsh
        env:
          REPO_CSC_LINK: ${{ secrets.CSC_LINK }}
          REPO_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $repoLink = if ($env:REPO_CSC_LINK) { $env:REPO_CSC_LINK.Trim() } else { '' }
          $repoPassword = if ($env:REPO_CSC_KEY_PASSWORD) { $env:REPO_CSC_KEY_PASSWORD.Trim() } else { '' }
          if ($repoLink -and $repoPassword) {
            $pfxPath = & ./scripts/prepare-csc-link.ps1 -Link $repoLink -Password $repoPassword
            & ./scripts/write-github-env.ps1 -Name 'CSC_LINK' -Value $pfxPath
            & ./scripts/write-csc-password-file.ps1 -Password $repoPassword
            Add-Content -Path $env:GITHUB_ENV -Value 'USE_REPO_SIGNING=true'
            Write-Host "Using repository CSC_LINK / CSC_KEY_PASSWORD secrets."
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "USE_REPO_SIGNING=false"
            Write-Host "Repository CSC_* secrets not configured; fallback self-signed cert will be generated."
          }

      - name: Prepare fallback self-signed certificate
        if: env.USE_REPO_SIGNING != 'true'
        shell: pwsh
        run: ./scripts/new-selfsigned-codesign.ps1 -ForCi

      - name: Verify signing certificate is configured
        shell: pwsh
        run: |
          . ./scripts/import-csc-env.ps1
          $pkg = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $publisher = $pkg.build.win.signtoolOptions.publisherName
          $assertArgs = @{
            Path                   = $env:CSC_LINK
            Password               = $env:CSC_KEY_PASSWORD
            ExpectedPublisherName  = $publisher
            SignToolPreflight      = $true
          }
          ./scripts/assert-signing-pfx.ps1 @assertArgs

      - name: Package Windows installer
        shell: pwsh
        run: |
          . ./scripts/import-csc-env.ps1
          pnpm exec electron-builder --win --publish never

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'AI-Shelf-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found in release/' }
          ./scripts/verify-windows-signature.ps1 -Path $installer.FullName -RequireSigned

      - name: Self-signed build notice
        if: env.USE_REPO_SIGNING != 'true'
        run: |
          echo "::notice::Installer is self-signed (not CA-trusted). SmartScreen may still warn users. See docs/WINDOWS_CODE_SIGNING.md"

      - name: Repository-signing notice
        if: env.USE_REPO_SIGNING == 'true'
        run: |
          echo "::notice::Installer was signed using repository CSC_LINK / CSC_KEY_PASSWORD secrets."

      # Release body matches CHANGELOG.md for this tag (single source of truth).
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AI-Shelf-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          body_path: release-notes.md
          generate_release_notes: false
