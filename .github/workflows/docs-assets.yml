name: Docs assets

# Regenerate README / docs screenshots on a Windows runner (Electron + display).
# CI is the canonical image source — inventory tabs reflect the runner environment,
# so local PNG/GIF bytes will not match CI. On PRs, refreshed assets are committed
# back to the PR branch; use workflow_dispatch on develop/main before release.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit updated PNG/GIF to the checked-out branch
        type: boolean
        default: true
  pull_request:
    paths:
      - "src/renderer/**"
      - "src/electron/**"
      - "tests/e2e/**"
      # Intentionally exclude tests/screenshots/** and docs/assets/terminal-demo.gif
      # so bot commits do not re-trigger this workflow in a loop.

permissions:
  contents: write

concurrency:
  group: docs-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh README docs images
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
        shell: pwsh

      - name: Generate docs assets
        env:
          AISHELF_DOCS_LOCALE: zh
        run: pnpm gen:docs-assets

      - name: Sync docs assets to branch
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.commit)
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/screenshots/*.png docs/assets/terminal-demo.gif
          $diff = git diff --cached --stat
          if (-not $diff) {
            Write-Host "Docs images are up to date."
            exit 0
          }
          Write-Host "Committing refreshed docs images:"
          Write-Host $diff
          git commit -m "docs: refresh README screenshots [skip ci]"
          if ("${{ github.event_name }}" -eq "pull_request") {
            git push origin "HEAD:refs/heads/$env:HEAD_REF"
          } else {
            git push
          }
